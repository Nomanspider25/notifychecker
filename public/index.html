<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leon Bike Zone ERP + Notify</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <header class="hero">
      <div>
        <p class="badge">Live ERP + Notification Control Center</p>
        <h1 id="biz-name"></h1>
        <p id="biz-meta"></p>
        <p id="biz-address"></p>
      </div>
      <div class="hero-status">
        <p><span class="dot"></span> Real-time sync active</p>
        <p id="clock"></p>
      </div>
    </header>

    <main>
      <section class="kpi-grid">
        <article><h3>Clients</h3><p id="kpi-clients">0</p></article>
        <article><h3>Open Invoices</h3><p id="kpi-open-invoices">0</p></article>
        <article><h3>Total Sales</h3><p id="kpi-sales">0</p></article>
        <article><h3>Messages Sent</h3><p id="kpi-messages">0</p></article>
      </section>

      <section class="card">
        <h2>Available Modules</h2>
        <ul id="module-list" class="pill-list"></ul>
      </section>

      <section class="card grid-2">
        <div>
          <h2>Add Client</h2>
          <form id="client-form">
            <input name="name" placeholder="Client name" required />
            <input name="phone" placeholder="Phone" required />
            <label><input type="checkbox" name="hasWhatsApp" checked /> Has WhatsApp</label>
            <select name="type">
              <option value="regular">Regular</option>
              <option value="emi">EMI</option>
            </select>
            <button type="submit">Save Client</button>
          </form>
        </div>

        <div>
          <h2>Create Invoice</h2>
          <form id="invoice-form">
            <select name="clientId" id="invoice-client" required></select>
            <input name="total" type="number" step="0.01" placeholder="Total amount" required />
            <input name="emiDueDate" type="date" required />
            <button type="submit">Create Invoice</button>
          </form>
        </div>
      </section>

      <section class="card grid-2">
        <div>
          <h2>Record Payment</h2>
          <form id="payment-form">
            <select name="invoiceId" id="payment-invoice" required></select>
            <input name="amount" type="number" step="0.01" required placeholder="Amount" />
            <button type="submit">Record Payment</button>
          </form>
        </div>

        <div>
          <h2>Admin Message</h2>
          <form id="admin-message-form">
            <select name="clientId" id="message-client" required></select>
            <input name="text" placeholder="Message to send" required />
            <button type="submit">Send</button>
          </form>
        </div>
      </section>

      <section class="card actions">
        <h2>Automation</h2>
        <button id="run-reminders">Run EMI Reminder Job (3-day rule)</button>
        <p id="sync-note">Listening for live updates...</p>
      </section>

      <section class="card">
        <h2>Message Log</h2>
        <ul id="message-log"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
